name: Build AURA Assistant

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: windows-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install .NET 8
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: 8.0.x

  - name: Publish Windows x64
    run: dotnet publish AURA.App/AURA.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish

  - name: Upload application files
    uses: actions/upload-artifact@v4
    with:
      name: AURA-Assistant-Windows-x64
      path: publish/
